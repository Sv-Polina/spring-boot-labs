spring.application.name=MyUiRestDbService
server.port=8087

spring.datasource.url=jdbc:h2:file:./testdb/students;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info,metrics,beans,env,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=MyUiRestDbService
info.app.description=Lab 7: Thymeleaf + Bootstrap + H2
info.app.version=0.0.1-SNAPSHOT
